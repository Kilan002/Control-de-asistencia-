<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="user-login-title">
            <header class="login-header">
                <h1 id="user-login-title">Iniciar sesión</h1>
                <p class="login-subtitle">Completa tus datos y toma tu foto para continuar.</p>
            </header>

            <form class="login-form" action="" method="post">
                <legend>Datos de acceso</legend>

                <div class="field">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <legend>Fotografía</legend>

                <div class="field">
                    <div id="camera-container">
                        <video id="video" autoplay playsinline></video>
                        <canvas id="canvas" style="display:none;"></canvas>
                        <img id="photo-preview" alt="Foto capturada" />
                        <input type="hidden" id="foto" name="foto">
                        <div class="camera-actions">
                            <button type="button" id="start-camera">Abrir cámara</button>
                            <button type="button" id="take-photo">Tomar foto</button>
                            <button type="button" id="retake-photo">Volver a tomar</button>
                        </div>
                        <p class="note">Usa la cámara para tomarte una foto.</p>
                    </div>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>
    <script src="../../js/shared/camera.js"></script>
</body>

</html>
